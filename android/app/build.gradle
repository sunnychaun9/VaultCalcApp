apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Derive versionName and versionCode from package.json so there is a single
 * source of truth.  versionCode = major*10000 + minor*100 + patch.
 */
def packageJson = new groovy.json.JsonSlurper().parseText(
    file("../../package.json").text
)
def appVersionName = packageJson.version                       // e.g. "1.0.0"
def semver = appVersionName.tokenize('.')*.toInteger()
def appVersionCode = semver[0] * 10000 + semver[1] * 100 + semver[2]

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["debug"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.vaultcalcapp"
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.vaultcalcapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def propsFile = rootProject.file("signing.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                def keystoreFile = file(props['storeFile'])
                if (keystoreFile.exists()) {
                    storeFile keystoreFile
                    storePassword props['storePassword']
                    keyAlias props['keyAlias']
                    keyPassword props['keyPassword']
                }
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Allow screenshots in debug/test builds
            buildConfigField "boolean", "ENABLE_FLAG_SECURE", "false"
        }
        release {
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Block screenshots in production builds
            // To test with screenshots: temporarily change to "false", rebuild, then revert
            buildConfigField "boolean", "ENABLE_FLAG_SECURE", "false"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Google Tink - Cryptographic library (CRYPTO-001)
    implementation("com.google.crypto.tink:tink-android:1.12.0")

    // Bouncy Castle - For Argon2id key derivation (CRYPTO-002)
    implementation("org.bouncycastle:bcprov-jdk18on:1.77")

    // Coroutines for async crypto operations
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3")

    // AndroidX Biometric - Fingerprint/face auth (BIO-001)
    implementation("androidx.biometric:biometric:1.1.0")

    // CameraX - Camera capture (intruder detection + private vault camera)
    implementation("androidx.camera:camera-core:1.3.1")
    implementation("androidx.camera:camera-camera2:1.3.1")
    implementation("androidx.camera:camera-lifecycle:1.3.1")
    implementation("androidx.camera:camera-view:1.3.1")
    implementation("androidx.camera:camera-video:1.3.1")

    // Guava - provides ListenableFuture required by CameraX's ProcessCameraProvider
    // (Tink also depends on Guava but doesn't expose it on compile classpath)
    implementation("com.google.guava:guava:32.1.3-android")

    // Google Play Services Location — FusedLocationProviderClient (SEC-005)
    implementation("com.google.android.gms:play-services-location:21.2.0")

    // Google Sign-In / Play Services Auth (CLOUD-001)
    implementation("com.google.android.gms:play-services-auth:21.2.0")

    // Google Mobile Ads SDK (ADS-001) — lazy-initialized, never on cold start
    implementation("com.google.android.gms:play-services-ads:23.6.0")

    // Google Play In-App Review API
    implementation("com.google.android.play:review:2.0.2")
    implementation("com.google.android.play:review-ktx:2.0.2")

    // Google UMP (User Messaging Platform) — GDPR/consent (ADS-002)
    implementation("com.google.android.ump:user-messaging-platform:3.1.0")

    // Google Play Billing (PREMIUM-002)
    implementation("com.android.billingclient:billing:7.1.1")

    // AndroidX SplashScreen — backports Android 12 splash API to API 23+
    implementation("androidx.core:core-splashscreen:1.0.1")

    // Media3 ExoPlayer — native video playback (VIDEO-010)
    implementation("androidx.media3:media3-exoplayer:1.3.1")
    implementation("androidx.media3:media3-ui:1.3.1")
}
